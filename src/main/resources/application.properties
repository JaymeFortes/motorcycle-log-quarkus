# Em %dev, com o driver do Postgres no classpath, o Quarkus Dev Services sobe
# um container automaticamente (nao precisa configurar URL/usuario/senha).
%dev.quarkus.datasource.db-kind=postgresql

# Por padrao o Dev Services escolhe uma porta aleatoria a cada restart - por
# isso a porta do Postgres sempre mudava. Fixando aqui, a conexao que voce
# salvar num cliente de banco (extensao do Postgres, DBeaver etc.) continua
# valida pra sempre: host localhost, porta 55432, db/usuario/senha "quarkus".
# So em %dev (nao em %test): fixar a mesma porta nos dois causaria conflito
# quando o "Continuous Testing" do quarkus:dev roda os testes em paralelo com
# o app - eles sobem containers de banco separados ao mesmo tempo.
%dev.quarkus.datasource.devservices.port=55432

# MVP: recria o schema a cada start (sem migrations ainda).
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Chave privada usada para ASSINAR o JWT no login (Jwt....sign()).
smallrye.jwt.sign.key.location=privateKey.pem

# Chave publica usada para VALIDAR o JWT recebido em rotas protegidas.
mp.jwt.verify.publickey.location=publicKey.pem

# Precisa bater com o issuer usado em AuthService ao emitir o token.
mp.jwt.verify.issuer=https://motolog.local/issuer

# quarkus.mailer.mock ja e "true" por padrao fora de %prod: nenhum e-mail sai
# de verdade em dev/teste, o Mailer so registra a mensagem (visivel no log e,
# em teste, via io.quarkus.mailer.MockMailbox). Nao precisa de SMTP aqui.
